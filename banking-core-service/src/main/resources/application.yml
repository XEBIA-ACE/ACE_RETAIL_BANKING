spring:
  application:
    name: banking-core-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/banking_core?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
  messages:
    basename: messages/notification-history
    encoding: UTF-8
    fallback-to-system-locale: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
security:
  jwt:
    secret: ${JWT_SECRET:}
server:
  port: ${SERVER_PORT:8080}
notification:
  history:
    # US-028 data-retention policy: drives both the history query window and the purge job.
    retention: ${NOTIFICATION_HISTORY_RETENTION:90d}
    default-time-zone: ${NOTIFICATION_HISTORY_DEFAULT_TZ:Europe/Zurich}
    purge-cron: ${NOTIFICATION_HISTORY_PURGE_CRON:0 30 2 * * *}
