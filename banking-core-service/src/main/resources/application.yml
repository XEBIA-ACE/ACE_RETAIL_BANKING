spring:
  application:
    name: banking-core-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/banking_core?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  messages:
    basename: messages/notification-history
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false
    always-use-message-format: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:}

server:
  port: ${SERVER_PORT:8080}

notification:
  history:
    # US-028 data-retention policy: drives both the history query window and the purge job.
    retention: ${NOTIFICATION_HISTORY_RETENTION:90d}
    default-time-zone: ${NOTIFICATION_HISTORY_DEFAULT_TZ:Europe/Zurich}
    default-page-size: 20
    max-page-size: 100
    purge-cron: ${NOTIFICATION_HISTORY_PURGE_CRON:0 30 2 * * *}
